<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <h1>Вход в аккаунт</h1>
    <div class="login-form" id="login-form">
        <div class="login-form__input-wrapper form-line">
            <label for="login">Ваш логин</label>
            <input type="text" name="login" id="login">
        </div>
        <div class="login-form__input-wrapper form-line">
            <label for="password">Ваш пароль</label>
            <input type="password" name="password" id="password">
        </div>
        <div class="login-form__footer form-line">
            <a href="register.html">Ты не из наших?</a>
            <button onclick="authButtonHandler()" title="Кнопка для входа" class="button main-button" id="login-button">
                Войти
            </button>
        </div>
    </div>

</body>
<script src="auth.js"></script>
<script>
    var button = document.getElementById('login-button');
    function authButtonHandler() {
        var login = document.getElementById('login').value;
        var password = document.getElementById('password').value
        if (authorize(login, password)) {
            alert("Вы успешно вошли в аккаунт")
        } else {
            alert("Вам здесь не место")
        }
    }

    //button.addEventListener("click", authButtonHandler);
</script>
</html>
