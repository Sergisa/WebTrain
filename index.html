    <img src="/vite.svg" class="logo" alt="Lit logo" />

    <div class="title">
        <h1>Расписание</h1>
        <h2 class="secondary">Очень важное расписание</h2>
    </div>
</div>
<div class="controls">
    <button class="btn" id="shift-left-button">shift-left</button>
    <button class="btn" id="shift-right-button">shift-right</button>
</div>
<calendar-element class="calendar" id="calendar"></calendar-element>
</body>
<script type="module">
    let calendar = document.getElementById('calendar');
    calendar.setDays(31);
    document.getElementById('shift-right-button').addEventListener('click', shiftRight);
    document.getElementById('shift-left-button').addEventListener('click', shiftLeft);

    function shiftLeft() {
        calendar.shift(-1)
    }

    function shiftRight() {
        calendar.shift(1)
    }

</script>
